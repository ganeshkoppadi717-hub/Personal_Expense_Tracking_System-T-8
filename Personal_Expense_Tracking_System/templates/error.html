{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card form-card">
  <h1 class="error-heading"><span class="heading-icon"><svg class="icon"><use href="#icon-spark"></use></svg></span>{{ code }} &ndash; {{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</div>
{% endblock %}
